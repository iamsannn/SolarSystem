<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System 3D</title>
<link rel="stylesheet" href="css/liquid-glass.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="scene"></div>
<div id="loader"><p>Charting the solar system…</p></div>
<div id="labels" aria-hidden="true"></div>

<!-- Top bar: menu button, brand, About link -->
<header class="topbar lg lg-nav">
  <div class="lg-nav-links"><button id="menu-btn" class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button></div>
  <h1 class="lg-text">Solar System</h1>
  <!-- Horizontal planet row; planets with moons open a dropdown (built by main.js) -->
  <nav id="planet-nav" class="lg-nav-links" aria-label="Planets"></nav>
  <div class="lg-nav-links"><a href="about.html">About</a></div>
</header>

<!-- Left menu (like NASA Eyes): search + Sun, planets and their moons -->
<aside id="menu" class="lg" aria-label="Solar system objects">
  <input id="search" class="search" type="search" placeholder="Search planets and moons" aria-label="Search">
  <div id="menu-list"></div>
</aside>

<div id="moon-menu" class="lg" role="menu"></div>
<div id="tooltip" role="status"></div>

<aside id="info" class="lg" aria-live="polite">
  <button id="info-close" aria-label="Close">×</button>
  <h2 id="info-name" class="lg-text"></h2>
  <p id="info-fact"></p>
  <dl id="info-stats"></dl>
</aside>

<!-- Control menu: time controls (date, rate, play) + layer toggles -->
<div class="dock controls-dock" id="controls">
  <div class="controls lg">
    <div class="clock"><div id="clock-date">—</div><div id="clock-rate">—</div></div>
    <button id="rate-down" aria-label="Slower / reverse">⏪</button>
    <button id="btn-pause">Pause</button>
    <button id="rate-up" aria-label="Faster">⏩</button>
    <button id="btn-now">Now</button>
    <span class="sep"></span>
    <button id="btn-orbits" aria-pressed="true">Orbits</button>
    <button id="btn-labels" aria-pressed="true">Labels</button>
    <button id="btn-belt" aria-pressed="true">Asteroids</button>
    <button id="btn-home">Home</button>
  </div>
</div>
<div class="dock toggle-dock">
  <button id="ctl-toggle" class="lg lg-btn" aria-expanded="true" aria-controls="controls">Hide controls</button>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="js/planets.js"></script>
<script src="js/textures.js"></script>
<script src="js/background.js"></script>
<script src="js/main.js"></script>
</body>
</html>
