<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- The WebGL canvas is injected here by main.js -->
<div id="scene"></div>

<div id="loader"><p>Charting the solar system…</p></div>

<header class="topbar">
  <h1>Solar System</h1>
  <!-- Planet buttons are generated by main.js -->
  <nav id="planet-nav" aria-label="Planets"></nav>
</header>

<div id="tooltip" role="status"></div>

<!-- Info overlay shown when a planet is clicked -->
<aside id="info" aria-live="polite">
  <button id="info-close" aria-label="Close">×</button>
  <h2 id="info-name"></h2>
  <p id="info-fact"></p>
  <dl id="info-stats"></dl>
</aside>

<footer class="controls">
  <button id="btn-pause">Pause</button>
  <label>Speed <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"></label>
  <button id="btn-orbits" aria-pressed="true">Orbits</button>
  <button id="btn-home">Overview</button>
  <span class="hint">Drag to rotate · scroll to zoom · right-drag to pan · click a planet</span>
</footer>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="js/planets.js"></script>
<script src="js/textures.js"></script>
<script src="js/background.js"></script>
<script src="js/main.js"></script>
</body>
</html>
